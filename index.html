<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Apostrof | Репертуар</title>
<meta name="description" content="Репертуар гитариста Апостроф гитарист - полный список песен, подборы аккордов на apostrofguitarist.com">
<meta name="theme-color" content="#e63946">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html { scroll-behavior: smooth; scrollbar-gutter: stable; background: var(--bg); }

:root{
  --a:#e63946;--a2:#b53d46;
  --ag:rgba(230,57,70,.35);--as:rgba(230,57,70,.15);
  --bg:#0f0f10;--bm:#151515;--bh:#1a1a1a;
  --card:rgba(31,41,55,.65);--bd:rgba(255,255,255,.08);
  --tx:#e8e8e8;--mt:#9ca3af;
  --tr:.25s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text}
img{-webkit-user-drag:none}
::selection{background:var(--ag);color:#fff}
::-moz-selection{background:var(--ag);color:#fff}

.no-scroll, .no-scroll body { overflow: hidden !important; touch-action: none !important; }
body{
  font-family:'Inter',sans-serif;color:var(--tx);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:5rem 1.25rem 3rem;
  background:
    radial-gradient(min(1100px,92vw) 460px at 50% 0,var(--as) 0%,transparent 75%),
    linear-gradient(180deg,var(--bg) 0%,var(--bm) 40%,var(--bh) 100%);
  background-attachment:fixed,fixed;
}
@media (hover: none) {
  body { background-attachment: scroll,scroll; }
  .sc, .cbtn, .act { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
  #topCtrl { position: absolute !important; }
}

::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--a2);border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--a)}

canvas#bgParticles{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
body>*:not(canvas){position:relative;z-index:1}
.tg{background-image:linear-gradient(to right,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.ico {
  display:inline-block; width:1.25rem; height:1.25rem;
  background-color:var(--a);
  -webkit-mask-size:contain; -webkit-mask-repeat:no-repeat; -webkit-mask-position:center;
  mask-size:contain; mask-repeat:no-repeat; mask-position:center;
}
.ico.tiktok { -webkit-mask-image:url('img/tiktok.svg'); mask-image:url('img/tiktok.svg'); }
.ico.search { -webkit-mask-image:url('img/Search.png'); mask-image:url('img/Search.png'); background-color:var(--mt); width:1.1rem; height:1.1rem; }
.ico.lang { -webkit-mask-image:url('img/language.svg'); mask-image:url('img/language.svg'); background-color:#fff; }
.ico.song { -webkit-mask-image:url('img/song.svg'); mask-image:url('img/song.svg'); width:1rem; height:1rem; }
.ico.color { -webkit-mask-image:url('img/color.svg'); mask-image:url('img/color.svg'); background-color:#fff; }
.ico.random { -webkit-mask-image:url('img/random.svg'); mask-image:url('img/random.svg'); width:2.0rem; height:2.0rem; background-color:#fff; }
.ico.heart { -webkit-mask-image:url('img/heart.svg'); mask-image:url('img/heart.svg'); width:.9rem; height:.9rem; background-color:var(--mt); transition:background-color var(--tr); }
.act.fon .ico.heart, .fon .ico.heart { background-color:var(--a); }

#topCtrl{position:fixed;top:1rem;right:1rem;z-index:50;display:flex;align-items:center;gap:.5rem}
.cbtn{
  width:2.75rem;height:2.75rem;display:flex;align-items:center;justify-content:center;
  border-radius:99px;background:rgba(12,17,26,.85);border:1px solid var(--bd);
  color:#fff;cursor:pointer;transition:background var(--tr),transform var(--tr);
  box-shadow:0 4px 14px rgba(0,0,0,.4);backdrop-filter:blur(10px);
  position:relative;overflow:hidden;
  will-change:transform;
}
.cbtn:hover{background:rgba(55,65,81,.9);transform:scale(1.05)}
.cbtn:hover .ico.lang { background-color:var(--a); }

#langMenu{
  position:absolute;right:0;top:calc(100% + .5rem);width:10.5rem;
  background:rgba(12,17,26,.97);backdrop-filter:blur(14px);
  border-radius:.75rem;border:1px solid var(--bd);padding:.4rem;
  box-shadow:0 18px 48px rgba(0,0,0,.5);
  opacity:0;transform:translateY(-8px) scale(.97);pointer-events:none;
  transition:opacity .14s ease,transform .14s ease;
}
#langMenu.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.lopt{
  display:block;width:100%;text-align:left;padding:.6rem .7rem;
  border-radius:.45rem;background:none;border:none;color:#fff;
  font-size:.875rem;cursor:pointer;font-family:'Inter',sans-serif;
  transition:background var(--tr);
}
.lopt:hover{background:rgba(255,255,255,.07)}
.lopt.al{background-image:linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 4px 14px var(--ag)}

header{text-align:center;margin-bottom:2.25rem;animation:fiu .5s ease both}
#aring{
  width:6.5rem;height:6.5rem;border-radius:99px;
  background:linear-gradient(135deg,var(--a),var(--a2));padding:4px;
  margin:0 auto 1.2rem;
  box-shadow:0 0 28px var(--ag),0 0 60px var(--as);
  animation:pulse 3s ease-in-out infinite;
  display:flex; align-items:center; justify-content:center;
}
#aring img{
  width:100%;height:100%;border-radius:99px;object-fit:cover;
  background:var(--bg);
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 20px var(--ag),0 0 50px var(--as)}
  50%{box-shadow:0 0 36px var(--ag),0 0 80px var(--as)}
}

h1{font-family:'Outfit',sans-serif;font-size:clamp(2rem,5vw,3rem);font-weight:800;letter-spacing:-.02em;margin-bottom:.4rem}
#mdesc{font-size:.95rem;color:var(--mt);max-width:32rem;margin:.25rem auto .9rem;line-height:1.55}
#tiklink{
  display:inline-flex;align-items:center;gap:.4rem;
  font-size:1rem;font-weight:600;color:var(--mt);text-decoration:none;
  transition:color var(--tr);margin-bottom:1.25rem;
}
#tiklink:hover{color:var(--a)}
#tiklink:hover .ico.tiktok { background-color:var(--a); }

#badges{display:flex;align-items:center;justify-content:center;gap:.7rem;flex-wrap:wrap}
.badge{
  display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .85rem;
  border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--bd);
  font-size:.85rem;font-weight:600;color:var(--mt);
}
.badge em{font-style:normal;color:var(--a);font-family:'Outfit',sans-serif;font-weight:700;font-size:.95rem;}

main{width:100%;max-width:42rem;overflow-anchor:none}

#srow{display:flex;gap:.75rem;margin-bottom:.5rem;align-items:center;width:100%;}
#swrap{position:relative;flex:1;display:flex;align-items:center;}
#sico{position:absolute;left:1rem;display:flex;align-items:center;pointer-events:none;}
#searchInput{
  width:100%;padding:.85rem 2.8rem .85rem 2.75rem;border-radius:.75rem;
  background:rgba(17,24,39,.6);border:1px solid rgba(255,255,255,.1);
  color:#fff;font-size:1rem;font-family:'Inter',sans-serif;
  outline:none;transition:border-color var(--tr),box-shadow var(--tr);
  box-shadow:0 8px 30px rgba(0,0,0,.12);
}
#searchInput::placeholder{color:#6b7280}
#searchInput:focus{border-color:var(--a);box-shadow:0 0 0 3px var(--as),0 8px 30px rgba(0,0,0,.12)}
#searchInput:focus ~ #sico .ico.search { background-color:var(--a); }
#clearSearch{
  position:absolute;right:0;display:none;align-items:center;
  padding:0 1rem;color:var(--mt);background:none;border:none;height:100%;
  cursor:pointer;font-size:1.1rem;transition:color var(--tr);
}
#clearSearch:hover{color:#fff}
#clearSearch.vis{display:flex}

#rndBtn{
  flex-shrink:0;width:3.1rem;height:3.1rem;border-radius:.75rem;
  background:rgba(31,41,55,.7);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 25px rgba(0,0,0,.3);transition:all var(--tr);
  position:relative;overflow:hidden;
}
#rndBtn .ico.random { background-color: var(--a); transition: background-color var(--tr); }
#rndBtn:hover{background:linear-gradient(135deg,var(--a),var(--a2));border-color:var(--a);transform:translateY(-2px) scale(1.05);box-shadow:0 10px 30px var(--ag)}
#rndBtn:hover .ico.random { background-color: #fff; }

.tabs-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:.8rem;}
#tabs{
  position:relative;display:inline-flex;gap:.2rem;padding:.25rem;
  border-radius:.75rem;background:rgba(17,24,39,.6);border:1px solid rgba(255,255,255,.1);
  overflow:hidden;max-width:100%;align-items:center;
}
#tabInd{
  position:absolute;top:-1px;left:-1px;
  background-image:linear-gradient(135deg,var(--a),var(--a2));
  border-radius:.5rem;box-shadow:0 6px 22px var(--ag);
  transition:transform .24s ease,width .24s ease,height .24s ease;
  pointer-events:none;z-index:0;
}
.tbtn{
  position:relative;z-index:1;padding:.55rem 1.1rem;border-radius:.5rem;
  border:none;background:none;color:rgba(255,255,255,.7);
  font-size:.9rem;font-family:'Inter',sans-serif;font-weight:500;
  cursor:pointer;transition:color var(--tr);white-space:nowrap;
  overflow:hidden;
}
.tbtn:hover{color:#fff}
.tbtn.at{color:#fff;font-weight:600}
.tbtn.hid{display:none}

#sortToggle{
  display:flex;background:rgba(17,24,39,.6);border-radius:.4rem;border:1px solid rgba(255,255,255,.1);
  padding:.15rem;
}
.sort-btn{
  padding:.25rem .5rem;font-size:.75rem;border:none;background:none;color:var(--mt);
  border-radius:.25rem;cursor:pointer;transition:all var(--tr);font-family:'Inter',sans-serif;
  white-space:nowrap;
}
.sort-btn.actv{background:var(--a);color:#fff;box-shadow:0 2px 8px var(--ag);}

#letters-wrap{position:relative;margin-bottom:.3rem;}
#letters{display:flex;flex-wrap:wrap;gap:.35rem;}
.lbtn{
  padding:.25rem .5rem;border-radius:.3rem;border:1px solid var(--bd);
  background:rgba(12,17,26,.55);color:var(--mt);font-size:.75rem;font-weight:700;
  cursor:pointer;transition:all var(--tr);position:relative;overflow:hidden;
}
.lbtn:hover{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2)}
.lbtn.la{background:linear-gradient(135deg,var(--a),var(--a2));border-color:var(--a);color:#fff;box-shadow:0 3px 10px var(--ag)}
#songList,#chordsList,#favList{list-style:none;padding:0;display:flex;flex-direction:column;gap:.75rem;position:relative;z-index:2;}
#sinfo{font-size:.8rem;color:var(--mt);margin-bottom:.25rem;margin-top:.15rem;text-align:center;}

.sc{
  background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:1rem;padding:.9rem 1.1rem;
  border:1px solid var(--bd);
  box-shadow:0 4px 20px rgba(0,0,0,.1);
  display:flex;align-items:center;gap:.85rem;cursor:pointer;
  transition:transform var(--tr),box-shadow var(--tr),border-color var(--tr);
  animation:cin .45s ease both;animation-delay:var(--sd,0ms);
}
.sc:hover{transform:translateY(-2px);box-shadow:0 12px 35px var(--as);border-color:var(--a);}

.sc.flash{
  animation:flash 2.5s ease both!important;
  position:relative; z-index:99;
}
@keyframes cin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes flash{
  0%{transform:scale(1);box-shadow:0 4px 20px rgba(0,0,0,.1);border-color:var(--bd)}
  15%,75%{transform:scale(1.03);box-shadow:0 0 0 100vmax rgba(0,0,0,.82), 0 0 40px var(--ag), 0 0 80px var(--as);border-color:var(--a);background:rgba(25,32,45,.98)}
  100%{transform:scale(1);box-shadow:0 4px 20px rgba(0,0,0,.1);border-color:var(--bd)}
}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

.sc__num{
  display:flex;align-items:center;justify-content:center;
  min-width:2.25rem;height:2.25rem;border-radius:99px;
  background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;
  font-weight:700;font-size:.9rem;font-family:'Outfit',sans-serif;
  box-shadow:0 4px 14px var(--ag);flex-shrink:0;
}
.sc.is-chord .sc__num { filter: hue-rotate(160deg); }
[data-theme="3"] .sc.is-chord .sc__num { filter:none; background:linear-gradient(135deg,#a855f7,#7c3aed)!important; box-shadow:0 4px 14px rgba(168,85,247,.4)!important; }
.sc__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:.1rem;}
.sc__title{font-size:1.05rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc__art{font-size:.85rem;color:var(--mt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc__acts{display:flex;align-items:center;gap:.4rem;flex-shrink:0;opacity:0;transition:opacity var(--tr)}
.sc:hover .sc__acts{opacity:1}

@media(max-width:768px){ .sc__acts{opacity:1} }

.act{
  width:2.1rem;height:2.1rem;border-radius:.5rem;border:1px solid var(--bd);
  background:rgba(255,255,255,.05);color:var(--mt);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all var(--tr);flex-shrink:0;
}
.act:hover{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2)}
.act.fon{color:var(--a);border-color:var(--a);background:var(--as)}
.sc a{display:flex;align-items:center;gap:.85rem;flex:1;text-decoration:none;color:inherit;min-width:0}
.empty{text-align:center;padding:2rem;color:var(--mt);font-size:1rem}
.empty.err{color:#f87171}
.empty.sh{animation:shake .4s ease}

.chh{display:flex;align-items:center;gap:.5rem;margin-bottom:1rem}
.chh h2{font-family:'Outfit',sans-serif;font-size:1.4rem;font-weight:700}

#songPag,#chordsPag{margin-top:1.25rem;display:flex;align-items:center;justify-content:center;gap:.4rem;flex-wrap:wrap;position:relative;z-index:2;}
.pbtn{
  padding:.45rem .85rem;border-radius:.5rem;border:1px solid var(--bd);
  background:rgba(17,24,39,.6);color:rgba(255,255,255,.7);
  font-size:.9rem;font-family:'Inter',sans-serif;cursor:pointer;
  transition:all var(--tr);position:relative;overflow:hidden;
}
.pbtn:hover{background:rgba(255,255,255,.1);color:#fff}
.pbtn.pa{border-color:var(--a);color:#fff;background:var(--as);box-shadow:0 0 12px var(--as)}
.pbtn.pd{opacity:.4;cursor:default;pointer-events:none}

#scrollTop{
  position:fixed;bottom:1.5rem;right:1.5rem;width:3rem;height:3rem;
  border-radius:99px;background:linear-gradient(135deg,var(--a),var(--a2));
  border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px var(--ag);z-index:40;
  opacity:0;transform:translateY(10px) scale(.88);pointer-events:none;
  transition:opacity .22s ease,transform .22s ease;
}
#scrollTop.vis{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
#scrollTop:hover{transform:translateY(-2px) scale(1.08)}
#scrollTop:active{transform:scale(.93)}

#toast{
  position:fixed;bottom:5rem;left:50%;
  transform:translateX(-50%) translateY(10px);
  background:rgba(17,24,39,.95);backdrop-filter:blur(14px);
  border:1px solid var(--a);color:#fff;padding:.7rem 1.4rem;
  border-radius:99px;font-size:.9rem;font-weight:500;
  box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:100;
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;
}
#toast.vis{opacity:1;transform:translateX(-50%) translateY(0)}

#songModal {
  position:fixed; inset:0; z-index:10000;
  background:transparent; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .35s ease;
  padding:1.5rem;
  perspective:1200px;
}
#songModal.vis { opacity:1; pointer-events:auto; }
.sm-box {
  position:relative; width:100%; max-width:460px;
  background:linear-gradient(160deg, rgba(45,60,85,.98) 0%, rgba(18,26,42,1) 60%, rgba(28,20,50,.98) 100%);
  border-radius:1.25rem; padding:2rem 1.5rem;
  border:1px solid rgba(255,255,255,.22);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.08) inset,
    0 24px 70px rgba(0,0,0,.8),
    0 0 80px var(--as),
    0 0 0 1.5px var(--a) inset;
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:1.2rem;
  transform:scale(.94) rotateX(0deg) rotateY(0deg);
  transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
  overflow:hidden;
  will-change:transform;
  transform-style:preserve-3d;
  backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
}
#songModal.vis .sm-box { transform:scale(1) rotateX(0deg) rotateY(0deg); }
.sm-box.auto-float { animation:holoFloat 6s ease-in-out infinite alternate; }
@keyframes holoFloat {
  0%   { transform: scale(1) rotateX(3deg) rotateY(-4deg); }
  33%  { transform: scale(1) rotateX(-2deg) rotateY(3deg); }
  66%  { transform: scale(1) rotateX(2deg) rotateY(4deg); }
  100% { transform: scale(1) rotateX(-3deg) rotateY(-2deg); }
}
.sm-holo {
  position:absolute; inset:0; pointer-events:none; z-index:2; border-radius:1.25rem;
  background: 
    radial-gradient(circle at 20% 0%, rgba(255,80,80,.15) 0%, transparent 60%),
    radial-gradient(circle at 80% 100%, rgba(80,180,255,.15) 0%, transparent 60%);
  mix-blend-mode:color-dodge;
  opacity:0;
  animation:holoShimmer 4s linear infinite;
  transition:opacity .3s ease;
}
.sm-box:hover .sm-holo { opacity:1; }
@keyframes holoShimmer {
  0%   { background-position:0% 0%; filter:hue-rotate(0deg); }
  100% { filter:hue-rotate(360deg); }
}
.sm-foil {
  position:absolute; inset:0; pointer-events:none; z-index:3; border-radius:1.25rem;
  background:linear-gradient(
    105deg,
    transparent 20%,
    rgba(255,255,255,.04) 30%,
    rgba(255,255,255,.12) 40%,
    rgba(255,255,255,.04) 50%,
    transparent 60%
  );
  mix-blend-mode:overlay;
  animation:foilSlide 3.5s ease-in-out infinite alternate;
}
@keyframes foilSlide {
  0%   { background-position:-200% 0; }
  100% { background-position:200% 0; }
}
.sm-glare {
  position:absolute; inset:0; pointer-events:none; z-index:4; border-radius:1.25rem;
  background:radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.28) 0%, rgba(255,255,255,.06) 35%, transparent 65%);
  opacity:0.85; mix-blend-mode:overlay;
  transition:background .06s linear;
}
.sm-shine {
  position:absolute; top:0; left:0; right:0; height:55%; pointer-events:none; z-index:5; border-radius:1.25rem 1.25rem 0 0;
  background:linear-gradient(180deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,.03) 50%, transparent 100%);
  mix-blend-mode:overlay;
}
.sm-bg-eq {
  position:absolute; inset:0; z-index:0; display:flex; gap:1.5rem; 
  align-items:flex-end; justify-content:center; opacity:0.1; padding:0 2rem;
  pointer-events:none;
}
.sm-bg-eq span { 
  flex:1; max-width:40px; background:var(--a); border-radius:4px 4px 0 0;
  animation:eqBg 1.5s ease-in-out infinite alternate; transform-origin:bottom; 
}
.sm-bg-eq span:nth-child(2) { animation-delay:-0.4s; }
.sm-bg-eq span:nth-child(3) { animation-delay:-0.8s; }
.sm-bg-eq span:nth-child(4) { animation-delay:-1.2s; }
.sm-bg-eq span:nth-child(5) { animation-delay:-1.6s; }
@media(max-width:640px){
  #songModal { padding:1rem 3rem; }
  .sm-box {
    max-width:260px;
    min-height:380px;
    padding:2.5rem 1.25rem 2rem;
    gap:1.5rem;
    justify-content:center;
    backdrop-filter:none; -webkit-backdrop-filter:none;
  }
  .sm-holo { display:block; mix-blend-mode:normal; opacity:0.18; animation:holoShimmer 5s linear infinite; }
  .sm-box:hover .sm-holo { opacity:0.18; }
  .sm-foil { display:none; }
  .sm-glare { display:none; }
  .sm-shine { display:none; }
  .sm-bg-eq { display:none; }
  .sm-title { font-size:1.35rem; }
  .sm-art { font-size:1rem; }
  .sm-num { width:3.5rem; height:3.5rem; font-size:1.2rem; }
}
.sm-num {

function buildPag(total,cur,onChange,container){
  if(!container)return;container.innerHTML='';
  const tp=Math.max(1,Math.ceil(total/PS));if(tp<=1)return;
  const btn=(label,page,dis,act)=>{
    const b=document.createElement('button');b.textContent=label;
    b.className='pbtn'+(act?' pa':'')+(dis?' pd':'');
    if(!dis&&!act)b.addEventListener('click',e=>{addRipple(b,e);onChange(page);try{window.scrollTo({top:0,behavior:'smooth'})}catch(x){window.scrollTo(0,0)}});
    return b;
  };
  container.appendChild(btn('‹',Math.max(1,cur-1),cur===1,false));
  let s=Math.max(1,cur-2),nd=Math.min(tp,s+4);s=Math.max(1,Math.min(s,nd-4));
  for(let p=s;p<=nd;p++)container.appendChild(btn(String(p),p,false,p===cur));
  container.appendChild(btn('›',Math.min(tp,cur+1),cur===tp,false));
}

const isMobile = () => window.matchMedia('(hover:none)').matches;

let smRafId = null;
let smTargetRX = 0, smTargetRY = 0;
let smCurrRX = 0, smCurrRY = 0;
let smMoving = false;

const smHolo = document.getElementById('smHolo');

function smAnimFrame() {
  smCurrRX += (smTargetRX - smCurrRX) * 0.2;
  smCurrRY += (smTargetRY - smCurrRY) * 0.2;
  smBox.style.transform = `scale(1) rotateX(${smCurrRX}deg) rotateY(${smCurrRY}deg)`;
  if(!isMobile()) {
    const gx = 50 + smCurrRY * 2.5;
    const gy = 30 - smCurrRX * 2.5;
    smGlare.style.background = `radial-gradient(ellipse at ${gx}% ${gy}%, rgba(255,255,255,.32) 0%, rgba(255,255,255,.06) 35%, transparent 65%)`;
  }
  const diffX = Math.abs(smTargetRX - smCurrRX);
  const diffY = Math.abs(smTargetRY - smCurrRY);
  if(diffX > 0.05 || diffY > 0.05) {
    smRafId = requestAnimationFrame(smAnimFrame);
  } else {
    smCurrRX = smTargetRX;
    smCurrRY = smTargetRY;
    smRafId = null;
  }
}

function smSchedule() {
  if(!smRafId) smRafId = requestAnimationFrame(smAnimFrame);
}

songModal.addEventListener('mousemove', e => {
  if(isMobile()) return;
  const r = smBox.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  const dx = (e.clientX - cx) / (r.width / 2);
  const dy = (e.clientY - cy) / (r.height / 2);
  smTargetRY = dx * 12;
  smTargetRX = -dy * 10;
  smSchedule();
});

songModal.addEventListener('mouseleave', () => {
  smTargetRX = 0;
  smTargetRY = 0;
  smSchedule();
});

const smObserver = new MutationObserver(() => {
  if(songModal.classList.contains('vis')) {
    smCurrRX = 0; smCurrRY = 0;
    smTargetRX = 0; smTargetRY = 0;
    smBox.classList.remove('auto-float');
    if(smRafId) { cancelAnimationFrame(smRafId); smRafId = null; }
    if(isMobile()) document.body.style.overflow = 'hidden';
  } else {
    smBox.classList.remove('auto-float');
    if(smRafId) { cancelAnimationFrame(smRafId); smRafId = null; }
    smBox.style.transform = '';
    smGlare.style.background = '';
    document.body.style.overflow = '';
  }
});
smObserver.observe(songModal, { attributes: true, attributeFilter: ['class'] });

songModal.addEventListener('touchmove', e => {
  if(!isMobile()) return;
  const touch = e.touches[0];
  const r = smBox.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  const dx = (touch.clientX - cx) / (r.width / 2);
  const dy = (touch.clientY - cy) / (r.height / 2);
  smTargetRY = Math.max(-1, Math.min(1, dx)) * 18;
  smTargetRX = Math.max(-1, Math.min(1, -dy)) * 14;
  smSchedule();
}, { passive: true });

songModal.addEventListener('touchend', () => {
  if(!isMobile()) return;
  smTargetRX = 0;
  smTargetRY = 0;
  smSchedule();
}, { passive: true });

function sortList(list){
  const l=[...list];
  l.sort((a,b)=>{
    if(sortBy==='id') {
      const aC = String(a.id).startsWith('c') ? 1 : 0;
      const bC = String(b.id).startsWith('c') ? 1 : 0;
      if(aC !== bC) return aC - bC;
      const aId = parseInt(String(a.id).replace('c',''), 10);
      const bId = parseInt(String(b.id).replace('c',''), 10);
      return aId - bId;
    }
    const aa=norm(sortBy==='artist'?a.artist:a.title),bb=norm(sortBy==='artist'?b.artist:b.title);
    if(aa!==bb)return aa.localeCompare(bb);
    return norm(sortBy==='artist'?a.title:a.artist).localeCompare(norm(sortBy==='artist'?b.title:b.artist));
  });
  return l;
}

async function fetchSongsData(){
  if(Array.isArray(ssCache))return true;
  try{
    const res=await fetch('data/songs.json');if(!res.ok)throw new Error();
    const data=await res.json();
    ssCache=data.map(s=>({...s, isC: false}));
    const total = ssCache.length + (Array.isArray(csCache) ? csCache.length : 0);
    if(scnt)countUp(scnt,total,900);return true;
  }catch(e){return false}
}
async function fetchChordsData(){
  if(Array.isArray(csCache))return true;
  try{
    const res=await fetch('data/mychords.json');if(!res.ok)throw new Error();
    const data=await res.json();
    csCache=data.map(c=>({...c, id: 'c'+c.id, isC: true}));
    if(ccnt)countUp(ccnt,csCache.length,900);
    if(scnt && Array.isArray(ssCache))countUp(scnt,ssCache.length+csCache.length,900);
    return true;
  }catch(e){return false}
}

async function renderSongs(t){
  await fetchChordsData();
  const ok=await fetchSongsData();
  if(!ok && (!csCache || csCache.length === 0)){songList.innerHTML=`<li class="empty err">${t.snf}</li>`;return}
  const allSongs = [...(ssCache||[]), ...(csCache||[])];
  const songs=sortList(allSongs);
  buildLetters(songs);
  const q=norm(sq);
  let filt=q?songs.filter(s=>norm(`${s.title} ${s.artist}`).includes(q)):songs;
  if(al)filt=filt.filter(s=>{
    const v=(sortBy==='title')?s.title:s.artist;
    return (v||'').charAt(0).toUpperCase()===al;
  });
  if(songs.length===0){songList.innerHTML=`<li class="empty err">${t.se}</li>`;return}
  if(filt.length===0){songList.innerHTML=`<li class="empty sh">${t.nr}</li>`;setSI(0,songs.length);return}
  setSI((q||al)?filt.length:null,songs.length);
  if(q||al){
    await exitAnim(songList);songList.innerHTML='';
    filt.forEach((s,i)=>songList.appendChild(mkCard(s,s.isC,i)));
    if(songPag)songPag.innerHTML='';return;
  }
  const total=filt.length,tp=Math.max(1,Math.ceil(total/PS));
  sp=Math.min(Math.max(1,sp),tp);const si=(sp-1)*PS;
  const page=filt.slice(si,Math.min(total,si+PS));
  await exitAnim(songList);songList.innerHTML='';
  page.forEach((s,i)=>songList.appendChild(mkCard(s,s.isC,i)));
  buildPag(total,sp,p=>{sp=p;renderSongs(t)},songPag);
}

async function renderChords(t){
  if(!chordsList)return;
  fetchSongsData();
  const ok=await fetchChordsData();
  if(!ok){chordsList.innerHTML=`<li class="empty err">${t.cnf}</li>`;return}
  const items=sortList(csCache);buildLetters(items);
  const q=norm(sq);
  let filt=q?items.filter(p=>norm(`${p.title} ${p.artist}`).includes(q)):items;
  if(al)filt=filt.filter(s=>{
    const v=(sortBy==='title')?s.title:s.artist;
    return (v||'').charAt(0).toUpperCase()===al;
  });
  if(items.length===0){chordsList.innerHTML=`<li class="empty err">${t.ce}</li>`;return}
  if(filt.length===0){chordsList.innerHTML=`<li class="empty sh">${t.nr}</li>`;setSI(0,items.length);return}
  setSI((q||al)?filt.length:null,items.length);
  if(q||al){
    await exitAnim(chordsList);chordsList.innerHTML='';
    filt.forEach((p,i)=>chordsList.appendChild(mkCard(p,true,i)));
    if(chordsPag)chordsPag.innerHTML='';return;
  }
  const total=filt.length,tp=Math.max(1,Math.ceil(total/PS));
  cp=Math.min(Math.max(1,cp),tp);const si=(cp-1)*PS;
  const page=filt.slice(si,Math.min(total,si+PS));
  await exitAnim(chordsList);chordsList.innerHTML='';
  page.forEach((p,i)=>chordsList.appendChild(mkCard(p,true,i)));
  buildPag(total,cp,p=>{cp=p;renderChords(t)},chordsPag);
}

let wAng = 0;
let lastWheelItems = [];
const wheelCanvas = $('wheelCanvas');
const wheelCtx = wheelCanvas.getContext('2d');
const spinBtnModal = $('spinBtnModal');

function drawWheel(items) {
  lastWheelItems = items;
  const cw = wheelCanvas.width, ch = wheelCanvas.height;
  const cx = cw/2, cy = ch/2;
  const r = cw/2;
  wheelCtx.clearRect(0,0,cw,ch);
  if(!items || !items.length) return;
  const step = (Math.PI*2)/items.length;
  const c1 = THEMES[thIdx].a;
  const c2 = THEMES[thIdx].a2;
  
  items.forEach((it, i) => {
    wheelCtx.beginPath();
    wheelCtx.moveTo(cx, cy);
    wheelCtx.arc(cx, cy, r, i*step, (i+1)*step);
    wheelCtx.fillStyle = i%2===0 ? c1 : c2;
    wheelCtx.fill();
    wheelCtx.save();
    wheelCtx.translate(cx, cy);
    wheelCtx.rotate(i*step + step/2);
    wheelCtx.textAlign = 'right';
    wheelCtx.fillStyle = '#fff';
    wheelCtx.font = 'bold 20px Inter';
    const text = (it.title.length > 20 ? it.title.substring(0,18)+'...' : it.title);
    wheelCtx.fillText(text, r - 25, 6);
    wheelCtx.restore();
  });
}

function spinWheel(items) {
  if(spinBtnModal.disabled) return;
  spinBtnModal.disabled = true;
  const winIdx = Math.floor(Math.random()*items.length);
  const step = 360 / items.length;
  const extra = 270 - (winIdx * step + step/2);
  const totalRot = wAng + 360*5 + extra - (wAng % 360); 
  wAng = totalRot;
  wheelCanvas.style.transform = `rotate(${totalRot}deg)`;
  
  setTimeout(async () => {
    spinBtnModal.disabled = false;
    const picked = items[winIdx];
    const isC = ('isC' in picked) ? picked.isC : (curTab==='chords');

    $('wheelModal').classList.remove('vis');
    document.documentElement.classList.remove('no-scroll');

    setTimeout(()=>{
      openSongModal(picked, isC, String(picked.id), isFav(String(picked.id)));
    }, 300);
  }, 5600);
}

rndBtn.addEventListener('click', async e=>{
  addRipple(rndBtn,e);
  const isC=curTab==='chords';
  let pool;
  if(isC) {
    if(!Array.isArray(csCache)) await fetchChordsData();
    pool = csCache;
  } else {
    await Promise.all([fetchSongsData(), fetchChordsData()]);
    pool = [...(ssCache||[]), ...(csCache||[])];
  }
  if(!Array.isArray(pool)||pool.length===0)return;
  const q=norm(sq);
  let filt=q?pool.filter(s=>norm(`${s.title} ${s.artist}`).includes(q)):pool;
  if(al)filt=filt.filter(s=>{
    const v=(sortBy==='title')?s.title:s.artist;
    return (v||'').charAt(0).toUpperCase()===al;
  });
  if(filt.length===0)filt=pool;
  
  let wheelItems = [];
  if (filt.length > 16) {
    const shuffled = [...filt].sort(() => 0.5 - Math.random());
    wheelItems = shuffled.slice(0, 16);
  } else {
    wheelItems = filt;
  }
  
  drawWheel(wheelItems);
  $('wheelModal').classList.add('vis');
  document.documentElement.classList.add('no-scroll');
});

themBtn.addEventListener('click',e=>{addRipple(themBtn,e);thIdx=(thIdx+1)%THEMES.length;applyTheme(thIdx)});

window.addEventListener('scroll',()=>stBtn.classList.toggle('vis',window.scrollY>300),{passive:true});
stBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

window.addEventListener('resize',()=>{
  const ae=curTab==='all'?tabAll:curTab==='chords'?tabChords:tabFav;
  if(!ae.classList.contains('hid'))moveInd(ae);
});

letters.addEventListener('scroll',()=>lettersWrap.classList.add('scrolled'),{once:true,passive:true});

function initInd(){
  const ae=curTab==='all'?tabAll:tabChords;
  const r=ae.getBoundingClientRect();
  tabInd.style.width=`${r.width}px`;tabInd.style.height=`${r.height}px`;
  moveInd(ae);
}

loadFavs();syncFavTab();
const savedLang=(()=>{try{return localStorage.getItem('lang')}catch(e){return null}})();
const savedTheme=(()=>{try{return parseInt(localStorage.getItem('thIdx')||'0',10)}catch(e){return 0}})();
thIdx=isNaN(savedTheme)?0:Math.max(0,Math.min(2,savedTheme));
applyTheme(thIdx);
const up=new URLSearchParams(window.location.search);
if(up.has('q'))sq=up.get('q');
if(up.has('tab')){const t=up.get('tab');if(['all','chords'].includes(t))curTab=t}
const prefs=(Array.isArray(navigator.languages)&&navigator.languages.length?navigator.languages:[navigator.language]).filter(Boolean);
function nLang(c){const b=String(c||'').toLowerCase().split('-')[0];return b==='ua'?'uk':b}
const initLang=TR[savedLang]?savedLang:(()=>{for(const p of prefs){const c=nLang(p);if(TR[c])return c}return'en'})();
updateUI(initLang);
requestAnimationFrame(initInd);

if(up.has('s')){
  const sid=up.get('s');
  Promise.all([fetchSongsData(),fetchChordsData()]).then(()=>{
    const all=[...(ssCache||[]),...(csCache||[])];
    const found=all.find(s=>String(s.id)===String(sid));
    if(found){
      setTimeout(()=>openSongModal(found,found.isC,String(found.id),isFav(String(found.id))),400);
    }
  });
}

// by apostrof_guitarist
const pc=document.getElementById('bgParticles');
if(pc&&pc.getContext){
  const ctx=pc.getContext('2d');
  const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  const isMob = () => isTouch || window.innerWidth <= 640;
  let cw=0,ch=0,dpr=Math.min(isMob()?1.5:2,Math.max(1,window.devicePixelRatio||1)),sw=0,sh=0;
  function resizeC(){
    const pw=sw,ph=sh;dpr=Math.min(isMob()?1.2:2,Math.max(1,window.devicePixelRatio||1));
    const vw=window.innerWidth,vh=window.innerHeight;
    cw=Math.floor(vw*dpr);ch=Math.floor(vh*dpr);
    pc.width=cw;pc.height=ch;pc.style.width=vw+'px';pc.style.height=vh+'px';
    sw=vw;sh=vh;ctx.setTransform(dpr,0,0,dpr,0,0);
    if(pw>0&&ph>0){const sx=sw/pw,sy=sh/ph;for(let i=0;i<pts.length;i++){pts[i].x*=sx;pts[i].y*=sy}}
  }
  const TC=isMob()?40:Math.min(140,Math.max(60,Math.floor((window.innerWidth*window.innerHeight)/18000)));
  const pts=[];
  let cachedRgb='';
  function updateRgb(){const hex=THEMES[thIdx].a.replace('#','');cachedRgb=`${parseInt(hex.slice(0,2),16)},${parseInt(hex.slice(2,4),16)},${parseInt(hex.slice(4,6),16)}`}
  function rnd(a,b){return Math.random()*(b-a)+a}
  function mkPt(){const sz=rnd(1,2.5);return{x:rnd(0,sw||window.innerWidth),y:rnd(0,sh||window.innerHeight),vx:rnd(-.05,.05),vy:-rnd(.08,.33)*(sz/2.5),sz,a:rnd(.2,.7)}}
  function seed(){pts.length=0;for(let i=0;i<TC;i++)pts.push(mkPt());updateRgb()}
  function wrap(p){const m=24,w=sw||window.innerWidth,h=sh||window.innerHeight;if(p.x<-m)p.x=w+m;if(p.x>w+m)p.x=-m;if(p.y<-m)p.y=h+m;if(p.y>h+m)p.y=-m}
  let lastT=performance.now();
  const getFpsTarget = () => isMob() ? 1000/30 : 0;
  let fpsAcc=0;
  function draw(dt){
    ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cw,ch);ctx.restore();
    const factor=Math.min(2.5,dt/16.666);
    for(let i=0;i<pts.length;i++){const p=pts[i];p.x+=p.vx*factor;p.y+=p.vy*factor;wrap(p);ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fillStyle=`rgba(${cachedRgb},${p.a})`;ctx.fill()}
  }
  let run=!document.hidden;
  function tick(now){
    if(!run)return;
    const n=now||performance.now();
    const dt=Math.max(1,Math.min(40,n-lastT));
    const tgt=getFpsTarget();
    if(tgt>0){fpsAcc+=dt;if(fpsAcc<tgt){requestAnimationFrame(tick);return}fpsAcc%=tgt}
    lastT=n;draw(dt);requestAnimationFrame(tick)
  }
  window.addEventListener('resize',resizeC);
  document.addEventListener('visibilitychange',()=>{run=!document.hidden;if(run){lastT=performance.now();requestAnimationFrame(tick)}});
  resizeC();seed();requestAnimationFrame(tick);
}

});
</script>
